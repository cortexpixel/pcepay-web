name: Build and Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip application bundle
        run: |
          set -e
          ZIP_NAME="${{ github.sha }}.zip"
          # Include necessary files for EB (package.json, .next or dist, node_modules will be installed on EB)
          zip -r "$ZIP_NAME" package.json package-lock.json .next public .ebextensions Procfile buildspec.yml || true
          echo "ZIP=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 cp "$ZIP_NAME" "s3://${{ secrets.S3_BUCKET }}/$ZIP_NAME"

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version --application-name "${{ secrets.EB_APP_NAME }}" --version-label "$ZIP_NAME" --source-bundle S3Bucket="${{ secrets.S3_BUCKET }}",S3Key="$ZIP_NAME"

      - name: Update EB environment
        run: |
          aws elasticbeanstalk update-environment --environment-name "${{ secrets.EB_ENV_NAME }}" --version-label "$ZIP_NAME"
